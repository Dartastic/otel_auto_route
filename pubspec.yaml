name: otel_auto_route
description: >-
  OpenTelemetry instrumentation for auto_route by Dartastic.io. Adds standard
  OpenTelemetry observability to applications that use auto_route.
version: 0.2.2-wip
repository: https://github.com/dartastic/otel_auto_route
homepage: https://dartastic.io

environment:
  sdk: ^3.0.0
  flutter: ">=3.0.0"

dependencies:
  auto_route: ">=9.0.0 <12.0.0"
  dartastic_opentelemetry_api: '>=1.0.0-rc.4 <1.0.0-rc.5'
  flutter:
    sdk: flutter

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2
  dartastic_opentelemetry: ^1.1.0-beta.17
  flutter_test:
    sdk: flutter
  pub_semver: ^2.0.0
  pubspec_parse: ^1.5.0
